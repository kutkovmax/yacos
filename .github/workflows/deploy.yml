name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw clean test -B

  build-and-push:
    name: Build & Push Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy on remote host
        uses: appleboy/ssh-action@v1.2.0
        env:
          COMPOSE_FILE_CONTENT: ${{ secrets.COMPOSE_FILE_CONTENT || '' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            mkdir -p /opt/yacos
            cd /opt/yacos
            
            # Записываем актуальный compose.yaml
            cat << 'EOF' > compose.yaml
            services:
              postgres:
                image: postgres:17-alpine
                container_name: yacos-postgres
                restart: unless-stopped
                environment:
                  POSTGRES_DB: ${POSTGRES_DB:-yacos}
                  POSTGRES_USER: ${POSTGRES_USER:-yacos}
                  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
                ports:
                  - "${POSTGRES_PORT:-127.0.0.1:3333}:5432"
                volumes:
                  - pgdata:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yacos} -d ${POSTGRES_DB:-yacos}"]
                  interval: 5s
                  timeout: 5s
                  retries: 5
            
              app:
                image: ghcr.io/${{ github.repository }}:latest
                container_name: yacos-app
                restart: unless-stopped
                depends_on:
                  postgres:
                    condition: service_healthy
                environment:
                  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-yacos}
                  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-yacos}
                  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
                  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
                  JAVA_TOOL_OPTIONS: "-Xms64m -Xmx192m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m"
                deploy:
                  resources:
                    limits:
                      memory: 450M
                ports:
                  - "127.0.0.1:${APP_PORT:-8080}:8080"
            
            volumes:
              pgdata:
            EOF
            
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull app
            docker compose up -d
            docker image prune -f
spring.application.name=yacos


logging.level.org.flywaydb=DEBUG


spring.output.ansi.enabled=ALWAYS

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never


spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:3333/yacos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:yacos}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:yacos}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# SpringDoc OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(---){faint} %clr([%15.15t]){faint} %clr([%X{requestId}]){cyan} %clr(%-40.40logger{39}){cyan} : %m%n



